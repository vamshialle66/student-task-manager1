<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow | Student Task Manager</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#e9edff 0,transparent 30%),
    radial-gradient(circle at 90% 90%,#e5faf2 0,transparent 30%),
    #f6f8fc;
  color:#172033;
  min-height:100vh;
}

.wrap{
  max-width:850px;
  margin:0 auto;
  padding:55px 22px 30px;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:42px;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  color:#5b67f1;
}

.status{
  font-size:11px;
  font-weight:700;
  color:#15845b;
  background:#e9faf3;
  border:1px solid #c9f0df;
  padding:8px 12px;
  border-radius:30px;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  background:#20b77a;
  border-radius:50%;
  margin-right:6px;
}

/* HERO */
.badge{
  display:inline-block;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.7px;
  color:#5b67f1;
  margin-bottom:12px;
}

h1{
  font-size:46px;
  line-height:1.08;
  letter-spacing:-2px;
  margin:0 0 12px;
}

.gradient{
  color:#5b67f1;
}

.sub{
  color:#667085;
  max-width:600px;
  line-height:1.6;
  margin:0 0 28px;
}

/* STATS */
.stats{
  display:flex;
  gap:12px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e6e9ef;
  border-radius:14px;
  padding:13px 18px;
  min-width:110px;
  box-shadow:0 5px 18px rgba(30,40,70,.04);
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#98a2b3;
  font-size:11px;
}

/* MAIN CARD */
.card{
  background:rgba(255,255,255,.94);
  border:1px solid #e4e7ed;
  border-radius:22px;
  padding:24px;
  box-shadow:0 18px 50px rgba(25,35,60,.08);
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.card-head h2{
  margin:0;
  font-size:18px;
}

.count{
  font-size:11px;
  font-weight:700;
  color:#667085;
  background:#f1f3f7;
  padding:7px 10px;
  border-radius:8px;
}

/* INPUT */
.form{
  display:flex;
  gap:10px;
}

.form input{
  flex:1;
  padding:14px 15px;
  border:1px solid #d9dee8;
  border-radius:11px;
  font-size:14px;
  outline:none;
  background:#fbfcfe;
  transition:.2s;
}

.form input:focus{
  border-color:#7a84ef;
  box-shadow:0 0 0 4px #eef0ff;
}

.form button{
  border:0;
  border-radius:11px;
  padding:0 20px;
  font-weight:700;
  cursor:pointer;
  color:#fff;
  background:#5b67f1;
  transition:.2s;
}

.form button:hover{
  background:#4c58df;
  transform:translateY(-1px);
}

/* TASKS */
ul{
  list-style:none;
  padding:0;
  margin:20px 0 0;
}

.task{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 4px;
  border-bottom:1px solid #edf0f4;
  animation:fade .2s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(3px)}
  to{opacity:1;transform:translateY(0)}
}

.task:last-child{
  border-bottom:0;
}

.task span{
  flex:1;
  font-size:14px;
}

.done{
  text-decoration:line-through;
  color:#98a2b3;
}

button{
  border:0;
  cursor:pointer;
  font-weight:700;
}

.small{
  background:#eef0ff;
  color:#4c57d8;
  border-radius:9px;
  padding:8px 11px;
  font-size:11px;
}

.delete{
  background:#fff0f0;
  color:#d64545;
  border-radius:9px;
  padding:8px 11px;
  font-size:11px;
}

.empty{
  text-align:center;
  color:#98a2b3;
  padding:30px 10px;
  font-size:13px;
}

.empty strong{
  display:block;
  color:#667085;
  margin-bottom:5px;
  font-size:14px;
}

/* FOOTER */
footer{
  text-align:center;
  color:#98a2b3;
  font-size:11px;
  margin-top:24px;
}

@media(max-width:600px){

  .wrap{
    padding-top:30px;
  }

  .header{
    margin-bottom:30px;
  }

  h1{
    font-size:36px;
  }

  .stats{
    overflow-x:auto;
  }

  .stat{
    min-width:100px;
  }

  .form{
    flex-direction:column;
  }

  .form button{
    height:46px;
  }

  .task{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">Task<span>Flow</span></div>

    <div class="status">
      <span class="dot"></span>
      System Online
    </div>
  </div>

  <!-- HERO -->
  <div class="badge">WEB TECHNOLOGY • MERN PROJECT</div>

  <h1>
    Organize your work.<br>
    <span class="gradient">Stay on track.</span>
  </h1>

  <p class="sub">
    A simple productivity dashboard to create, manage and complete
    your academic tasks from one place.
  </p>

  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <strong id="total">0</strong>
      <span>Total Tasks</span>
    </div>

    <div class="stat">
      <strong id="completed">0</strong>
      <span>Completed</span>
    </div>

    <div class="stat">
      <strong id="pending">0</strong>
      <span>Pending</span>
    </div>

  </div>

  <!-- APP -->
  <div class="card">

    <div class="card-head">
      <h2>My Tasks</h2>
      <div class="count" id="count">0 tasks</div>
    </div>

    <div class="form">

      <input
        id="i"
        placeholder="What needs to be done today?"
        onkeydown="if(event.key==='Enter')add()"
      >

      <button onclick="add()">+ Add Task</button>

    </div>

    <ul id="list"></ul>

  </div>

  <footer>
    TaskFlow • Student Task Manager • Web Technology
  </footer>

</div>

<script>

let a = JSON.parse(
  localStorage.getItem('tasks') || '[]'
);

function save(){

  localStorage.setItem(
    'tasks',
    JSON.stringify(a)
  );

  show();
}

function add(){

  let input = document.getElementById('i');

  let t = input.value.trim();

  if(!t) return;

  a.unshift({
    t:t,
    d:0
  });

  input.value = '';

  save();

  input.focus();
}

function toggle(i){

  a[i].d = !a[i].d;

  save();
}

function del(i){

  a.splice(i,1);

  save();
}

function show(){

  let list = document.getElementById('list');

  let completed =
    a.filter(x => x.d).length;

  let pending =
    a.length - completed;

  document.getElementById('total')
    .textContent = a.length;

  document.getElementById('completed')
    .textContent = completed;

  document.getElementById('pending')
    .textContent = pending;

  document.getElementById('count')
    .textContent =
      a.length + ' task' +
      (a.length === 1 ? '' : 's');

  if(!a.length){

    list.innerHTML = `
      <div class="empty">
        <strong>Your task list is clear ✨</strong>
        Add your first task above to get started.
      </div>
    `;

    return;
  }

  list.innerHTML = a.map((x,i) => `

    <li class="task">

      <span class="${x.d ? 'done' : ''}">
        ${escapeHTML(x.t)}
      </span>

      <button
        class="small"
        onclick="toggle(${i})"
      >
        ${x.d ? 'Undo' : 'Done'}
      </button>

      <button
        class="delete"
        onclick="del(${i})"
      >
        Delete
      </button>

    </li>

  `).join('');

}

function escapeHTML(text){

  return text.replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );

}

show();

</script>

</body>
</html>
