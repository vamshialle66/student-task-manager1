<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Task Manager</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:760px;margin:70px auto;padding:20px}.badge{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#667085}h1{font-size:38px;margin:10px 0 8px}.sub{color:#667085;margin:0 0 28px}.card{background:#fff;border:1px solid #e6e9ef;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(20,30,50,.06)}.form{display:flex;gap:10px}.form input{flex:1;padding:14px;border:1px solid #d9dee8;border-radius:11px;font-size:15px}.form button,button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#5b67f1;color:#fff}.task{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #edf0f4}.task span{flex:1}.done{text-decoration:line-through;color:#98a2b3}.small{background:#eef0ff;color:#4c57d8}.delete{background:#fff0f0;color:#d64545}.empty{text-align:center;color:#98a2b3;padding:25px}ul{list-style:none;padding:0;margin:22px 0}footer{text-align:center;color:#98a2b3;font-size:12px;margin-top:22px}</style></head>
<body><div class="wrap"><div class="badge">WEB TECHNOLOGY • MERN</div><h1>Student Task Manager</h1><p class="sub">A simple task management application.</p><div class="card"><div class="form"><input id="i" placeholder="Enter a task..." onkeydown="if(event.key==='Enter')add()"><button onclick="add()">Add Task</button></div><ul id="list"></ul></div><footer>Built for Web Technology</footer></div>
<script>let a=JSON.parse(localStorage.getItem('tasks')||'[]');function save(){localStorage.setItem('tasks',JSON.stringify(a));show()}function add(){let i=document.getElementById('i'),t=i.value.trim();if(!t)return;a.push({t,d:0});i.value='';save();i.focus()}function toggle(i){a[i].d=!a[i].d;save()}function del(i){a.splice(i,1);save()}function show(){let l=document.getElementById('list');if(!a.length){l.innerHTML='<div class="empty">No tasks yet. Add your first task!</div>';return}l.innerHTML=a.map((x,i)=>'<li class="task"><span class="'+(x.d?'done':'')+'">'+x.t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span><button class="small" onclick="toggle('+i+')">'+(x.d?'Undo':'Done')+'</button><button class="delete" onclick="del('+i+')">Delete</button></li>').join('')}show()</script></body></html>
